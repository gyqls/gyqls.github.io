<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>배경 위 메뉴</title>
  <style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      height: 100vh;
      overflow: hidden;
    }

    /* 배경 */
    .item-bg {
      position: relative;
      width: 100%;
      height: 100%;
      background: url('p6.png') center/cover no-repeat;
      z-index: 0; /* 배경은 가장 아래 */
    }

    /* 상단 메뉴 */
    .menu {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 30px;
      z-index: 10; /* 배경 위로 올림 ✅ */
    }

    .menu a {
      display: inline-block;
      padding: 10px 25px;
      border: 2px solid #2D2D2D;
      border-radius: 50px;
      color: #2D2D2D;
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      transition: 0.3s;
    }

    .menu a:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }

    /* 오른쪽 하단 버튼 */
    .bottom-btn {
      position: absolute;
      bottom: 40px;
      right: 60px;
      border: 2px solid #2D2D2D;
      border-radius: 50px;
      padding: 8px 22px;
      font-size: 18px;
      color: #2D2D2D;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
      z-index: 10; /* 배경 위로 올림 ✅ */
    }

    .bottom-btn:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }

    h2 {
  position: absolute;
  top: 15%;               
  left: 50%;              
  transform: translate(-50%, -50%); 
  color: #2D2D2D;            
  font-size: 28px;
  font-weight: 800;
  margin: 0;
  z-index: 5;             
}

p {
  position: absolute;
  top: 20%;               
  left: 50%;              
  transform: translate(-50%, -50%); 
  color: #2D2D2D;            
  font-size: 20px;
  font-weight: 500;
  margin: 0;
  z-index: 5;             
}

.img1 {
  position: absolute;
  top: 28%;            /* 🔹 상자의 세로 위치에 맞게 조정 */
  left: 27.9%;         /* 🔹 첫 번째 상자 안 중앙 위치 */
  width: 392px;
  height: 522.67px;
  object-fit: cover;   /* 🔹 비율 유지하면서 상자 꽉 채움 */
  border: none;
  z-index: 5;
}

.img2 {
  position: absolute;
  top: 28%;            /* 🔹 두 번째 상자 위치에 맞게 */
  left: 52%;         /* 🔹 오른쪽 상자 중앙 */
  width: 380px;
  height: 454px;
  object-fit: cover;
  border: none;
  z-index: 5;
}

h4:nth-of-type(1) {
  position: absolute;
  top: calc(27.5% + 530px);   /* 첫 번째 이미지의 아래쪽 (이미지 높이보다 약간 더 아래) */
  left: 38%;                /* 이미지 중앙정렬 느낌으로 */
  transform: translateX(-50%);
  color: #2D2D2D;
  font-size: 18px;
  font-weight: 600;
}

h4:nth-of-type(2) {
  position: absolute;
  top: calc(34% + 470px);   /* 두 번째 이미지 아래쪽 */
  left: 62%;                /* 오른쪽 이미지 중앙 */
  transform: translateX(-50%);
  color: #2D2D2D;
  font-size: 18px;
  font-weight: 600;
}

audio {
  position: absolute;
  top: calc(35% + 540px);  /* 글자 아래로 조금 더 내려가게 */
  left: 50%;               /* 오른쪽 이미지(h4) 기준 중앙 */
  transform: translateX(-50%);
  width: 250px;            /* 오디오 플레이어 길이 */
  z-index: 5;
} 

  </style>
</head>
<body>
  <div class="item-bg">
    <nav class="menu">

      <a href="index3.html">First Steps</a>
      <a href="index4.html">Journey1</a>
      <a href="index5.html">Journey2</a>
      <a href="index6.html">Yet to come</a>
    </nav>

    <a href="index.html" class="bottom-btn">main →</a>

  </div>
</body>
</html>
