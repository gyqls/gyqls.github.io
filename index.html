<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
    body {
      margin: 0;
      font-family: 'Arial', sans-serif;
      height: 100vh;
      overflow: hidden;
      font-weight: 600;
      display: flex;
  justify-content: center;
  align-items: center;
    }

    /* 배경 */
    .item-bg {
      position: relative;
      width: 100%;
      height: 100%;
      background: url('./p1.png') center/cover no-repeat;
      z-index: 0; 
    }
    .menu {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 30px;
      z-index: 10; 
    }

    .menu a {
      display: inline-block;
      padding: 10px 25px;
      border: 2px solid #2D2D2D;
      border-radius: 50px;
      color: #2D2D2D;
      text-decoration: none;
      font-size: 18px;
      font-weight: 300;
      transition: 0.3s;
    }

    .menu a:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }

    /* 오른쪽 하단 버튼 */
    .bottom-btn {
      position: absolute;
      bottom: 40px;
      right: 60px;
      border: 2px solid #2D2D2D;
      border-radius: 50px;
      padding: 8px 22px;
      font-size: 18px;
      color: #2D2D2D;
      text-decoration: none;
      font-weight: 600;
      transition: 0.3s;
      z-index: 10; 
    }

    .bottom-btn:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }

    h1 {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  margin: 0;
  font-size: 180px;
  font-weight: 5000; 
  letter-spacing: -25px;
  text-align: center;
  z-index: 5;
  white-space: nowrap; 
}
.b { color: #CC1A2D; } /* 빨강 */
    .u { color: #0A9041; } /* 초록 */
    .c { color: #F3EE12; } /* 주황 */
    .k { color: #38449A; } /* 남색 */
    .e { color: #EF940E; } /* 노랑 */
    .t { color: #CC1A2D; } /* 파랑 */
</style>
<body>

  <div class="item-bg">
    <nav class="menu">
      <a href="index2.html">Beginning</a>
      <a href="index3.html">First Steps</a>
      <a href="index4.html">Journey1</a>
      <a href="index5.html">Journey2</a>
      <a href="index6.html">Yet to come</a>
    </nav>
    <h1>
      <span class="b">B</span>
      <span class="u">U</span>
      <span class="c">C</span>
      <span class="k">K</span>
      <span class="e">E</span>
      <span class="t">T</span>
    </h1>
  </div>
</body>
</html>
